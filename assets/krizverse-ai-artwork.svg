<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">KRIZVERSE — Intelligence in Motion</title>
<desc id="desc">Original abstract AI artwork with a luminous neural core, orbital pathways, and gold data points against a deep black space.</desc>
<defs>
  <radialGradient id="bg"><stop offset="0" stop-color="#211A10"/><stop offset=".58" stop-color="#0B0B0D"/><stop offset="1" stop-color="#050506"/></radialGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#FFF4CF" stop-opacity=".98"/><stop offset=".18" stop-color="#D9B66B" stop-opacity=".75"/><stop offset="1" stop-color="#D9B66B" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1C6"/><stop offset=".45" stop-color="#D6B56D"/><stop offset="1" stop-color="#78552A"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D6B56D" stop-opacity="0"/><stop offset=".5" stop-color="#F6DFA7" stop-opacity=".85"/><stop offset="1" stop-color="#D6B56D" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#D6B56D" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="460" rx="18" fill="url(#bg)"/>
<rect width="1200" height="460" rx="18" fill="url(#grid)"/>
<g fill="none" stroke="url(#gold)" stroke-opacity=".5">
  <ellipse cx="830" cy="225" rx="275" ry="92" transform="rotate(-28 830 225)" stroke-width="1.2"/>
  <ellipse cx="830" cy="225" rx="250" ry="130" transform="rotate(35 830 225)" stroke-width="1"/>
  <ellipse cx="830" cy="225" rx="220" ry="72" transform="rotate(78 830 225)" stroke-width="1"/>
  <circle cx="830" cy="225" r="154" stroke-dasharray="2 9" stroke-opacity=".65"/>
</g>
<circle cx="830" cy="225" r="160" fill="url(#core)" opacity=".8" filter="url(#glow)"/>
<g stroke="#E7C77E" stroke-width="1.3" stroke-opacity=".72" fill="none">
  <path d="M650 260L712 213 758 244 799 176 842 206 891 150 944 188 1000 130"/>
