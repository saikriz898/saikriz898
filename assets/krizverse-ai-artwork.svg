<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="76" y="90" fill="#D6B56D" font-size="13" letter-spacing="5">PERSONAL AI UNIVERSE / 001</text>
  <text x="72" y="165" fill="#F7F0DF" font-size="53" font-weight="750" letter-spacing="1">KRIZVERSE</text>
  <text x="76" y="205" fill="#D6B56D" font-size="18" letter-spacing="3">HUMAN CURIOSITY × MACHINE INTELLIGENCE</text>
  <text x="76" y="252" fill="#E9E1D1" font-size="16" opacity=".82">Designing systems. Building intelligence.</text>
  <text x="76" y="279" fill="#E9E1D1" font-size="16" opacity=".82">Turning ideas into things that work.</text>
  <text x="76" y="402" fill="#D6B56D" font-size="12" letter-spacing="3">SAI KRISHNAN S</text>
  <text x="1122" y="402" fill="#93866D" font-size="11" text-anchor="end" letter-spacing="2">IDEATE / BUILD / EVOLVE</text>
