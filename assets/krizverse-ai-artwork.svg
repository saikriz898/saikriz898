  <circle cx="712" cy="213" r="4"/><circle cx="758" cy="244" r="3"/><circle cx="799" cy="176" r="5"/><circle cx="842" cy="206" r="4"/><circle cx="891" cy="150" r="5"/><circle cx="944" cy="188" r="3"/><circle cx="1000" cy="130" r="4"/>
  <circle cx="744" cy="274" r="3"/><circle cx="788" cy="291" r="4"/><circle cx="830" cy="246" r="5"/><circle cx="880" cy="273" r="3"/><circle cx="926" cy="238" r="4"/><circle cx="972" cy="267" r="3"/>
  <circle cx="751" cy="184" r="3"/><circle cx="788" cy="142" r="4"/><circle cx="827" cy="168" r="3"/><circle cx="870" cy="122" r="4"/><circle cx="917" cy="148" r="3"/>
